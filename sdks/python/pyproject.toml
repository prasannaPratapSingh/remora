[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "remora-ai"
version = "0.1.0"
description = "Official Python SDK for Remora AI Memory Infrastructure"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Remora Team", email = "hello@remora.ai" }
]
keywords = [
    "ai",
    "memory",
    "agents",
    "llm",
    "mem0",
    "langchain",
    "crewai",
    "embeddings",
    "vector-search",
    "pgvector"
]
dependencies = [
    "httpx>=0.25.0",
    "pydantic>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0"
]

[tool.hatch.build.targets.wheel]
packages = ["remora"]
